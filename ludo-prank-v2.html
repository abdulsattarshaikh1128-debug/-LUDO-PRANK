/* LUDO PRANK reward rules: daily calendar, weekly rewards, spin wheel.
   ONE implementation used by the game prototype AND by a server. In production the SERVER runs these functions with its own clock
   and random generator (never trust the client's clock or dice). Pure state-in/state-out, no I/O. */
const RW = (() => {
  const DAY = 864e5, LIM = { free: 3, ad: 3, total: 6 }, OWNED_BONUS = 150;
  const iso = (t) => new Date(t).toISOString().slice(0, 10);
  const wk = (t) => { const d = new Date(t); d.setUTCHours(0, 0, 0, 0); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7)); const y = d.getUTCFullYear(); return y + '-W' + String(Math.ceil(((d - Date.UTC(y, 0, 1)) / DAY + 1) / 7)).padStart(2, '0'); };
  const nextDay = (t) => { const d = new Date(t); d.setUTCHours(0, 0, 0, 0); return d.getTime() + DAY; };
  const nextWeek = (t) => { const d = new Date(t); d.setUTCHours(0, 0, 0, 0); return d.getTime() + (8 - (d.getUTCDay() || 7)) * DAY; };
  const DICE = ['Golden Dice', 'Starry Dice', 'Candy Dice', 'Neon Dice', 'Ice Dice'], TOKS = ['Diamond Tokens', 'Rainbow Tokens', 'Glow Tokens', 'Fire Tokens', 'Galaxy Tokens'];
  const AV = ['🦖', '🧞', '🥷', '🧙', '👽', '🤴'], FRN = ['Gold Crown', 'Fire', 'Galaxy'];   // avatars 12..17, frames 6..8
  const DAILY = [
    { name: 'Starter Week', d: [{ c: 150 }, { g: 5 }, { t: 1 }, { item: 'avatar:12' }, { item: 'dice:Candy Dice' }, { item: 'token:Glow Tokens' }, { c: 500, g: 25, item: 'frame:6', prem: 1 }] },
    { name: 'Festival Week', d: [{ c: 200 }, { g: 8 }, { t: 2 }, { item: 'avatar:13' }, { item: 'dice:Starry Dice' }, { item: 'token:Rainbow Tokens' }, { c: 800, g: 40, item: 'frame:7', prem: 1 }] },
    { name: 'Champion Week', d: [{ c: 250 }, { g: 10 }, { t: 2 }, { item: 'avatar:14' }, { item: 'dice:Golden Dice' }, { item: 'token:Diamond Tokens' }, { c: 1000, g: 50, item: 'frame:8', prem: 1 }] }];
  const WEEKLY = [
    { name: 'Neon Collection', t: [{ c: 300, g: 5 }, { t: 1, c: 100 }, { item: 'dice:Neon Dice' }, { item: 'token:Fire Tokens' }, { item: 'avatar:15', c: 500, g: 20 }] },
    { name: 'Frost Collection', t: [{ c: 400 }, { t: 2 }, { item: 'dice:Ice Dice' }, { item: 'token:Galaxy Tokens' }, { item: 'avatar:16', c: 600, g: 25 }] },
    { name: 'Royal Collection', t: [{ g: 10 }, { c: 300, t: 1 }, { item: 'dice:Neon Dice', c: 100 }, { item: 'token:Fire Tokens', c: 100 }, { item: 'avatar:17', c: 800, g: 30 }] }];
  const NEED = [{ k: 'days', n: 3 }, { k: 'games', n: 5 }, { k: 'wins', n: 2 }, { k: 'caps', n: 10 }, { k: 'all', n: 4 }];
  const WHEEL = [
    { t: '🪙 50', c: 50, w: 24 }, { t: '🪙 100', c: 100, w: 17 }, { t: '🪙 200', c: 200, w: 6 }, { t: '💎 5', g: 5, w: 15 }, { t: '💎 15', g: 15, w: 5 },
    { t: '🎁 Chest', c: 150, g: 5, w: 8, d: 'Reward chest: 🪙 150 + 💎 5' }, { t: '🎲 Dice', pool: 'dice', w: 8, d: 'Random dice skin you do not own yet' },
    { t: '🎨 Token', pool: 'token', w: 8, d: 'Random token skin you do not own yet' }, { t: '🖼️ Frame', pool: 'frame', w: 8, d: 'Profile frame you do not own yet' }, { t: '👑 JACKPOT', c: 1500, g: 50, w: 1, jp: 1, d: 'JACKPOT: 🪙 1500 + 💎 50' }];
  const POOL = { dice: DICE.map((n) => 'dice:' + n), token: TOKS.map((n) => 'token:' + n), frame: ['frame:7', 'frame:8'] };
  const newState = () => ({ gems: 30, coins: 1250, tickets: 0, inv: [], eq: { dice: null, token: null }, tx: [], claims: {}, seen: 0, hist: [],
    daily: { cycle: 0, day: 0, last: '' }, week: { key: '', prog: { days: 0, games: 0, wins: 0, caps: 0, spins: 0 }, claimed: {} }, sp: { day: '', free: 0, ad: 0, tk: 0 } });
  const name = (it) => { const [ty, v] = it.split(':'); return ty === 'avatar' ? AV[v - 12] + ' Avatar' : ty === 'frame' ? '🖼️ ' + FRN[v - 6] + ' frame' : (ty === 'dice' ? '🎲 ' : '🎨 ') + v; };
  const describe = (r) => [r.c ? '🪙 ' + r.c : '', r.g ? '💎 ' + r.g : '', r.t ? '🎟️ ×' + r.t : '', r.item ? name(r.item) : ''].filter(Boolean).join(' + ');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  /* time: never goes backwards (clock rollback cannot reopen a claimed day); rolls the week and the daily spin counters */
  function tick(st, raw) { const now = Math.max(raw, st.seen || 0); st.seen = now; const k = wk(now); if (st.week.key !== k) st.week = { key: k, prog: { days: 0, games: 0, wins: 0, caps: 0, spins: 0 }, claimed: {} }; const d = iso(now); if (st.sp.day !== d) st.sp = { day: d, free: 0, ad: 0, tk: 0 }; return now; }
  /* credits exactly what it returns; an item already owned becomes coins (stated in the text) */
  function grant(st, r, src, now, key) {
    const out = { coins: r.c || 0, gems: r.g || 0, tickets: r.t || 0, item: null, text: '' };
    if (r.item) { if (st.inv.includes(r.item)) { out.coins += OWNED_BONUS; out.conv = r.item; } else { st.inv.push(r.item); out.item = r.item; } }
    st.coins += out.coins; st.gems += out.gems; st.tickets += out.tickets;
    out.text = describe(Object.assign({}, r, { item: out.item, c: out.coins, g: out.gems, t: out.tickets })) + (out.conv ? ' (you already own ' + name(out.conv) + ')' : '');
    st.tx.push({ id: uid(), ts: now, src, key, coins: out.coins, gems: out.gems, tickets: out.tickets, item: out.item }); if (st.tx.length > 300) st.tx.shift();
    return out;
  }
  /* Daily/weekly bonuses can require a watched rewarded ad: opt.requireAd + opt.adProof {verified:true, txId, kind}. The proof is single use. */
  function adGate(st, opt, kind) {
    if (!opt || !opt.requireAd) return null; const a = opt.adProof;
    if (!a || a.verified !== true || !a.txId || a.kind !== kind) return { ok: false, reason: 'ad_unverified' };
    if (st.claims['ad:' + a.txId]) return { ok: false, reason: 'ad_already_used' }; return null;
  }
  const useAd = (st, opt) => { if (opt && opt.requireAd) st.claims['ad:' + opt.adProof.txId] = 1; };
  function claimDaily(st, raw, opt) {
    const now = tick(st, raw), today = iso(now); if (st.daily.last === today || st.claims['daily:' + today]) return { ok: false, reason: 'already_claimed' };
    const g = adGate(st, opt, 'daily'); if (g) return g; useAd(st, opt);
    const d = st.daily; if (d.day >= 7) { d.cycle++; d.day = 0; }
    const r = DAILY[d.cycle % 3].d[d.day], res = grant(st, r, 'daily', now, 'daily:' + today);
    st.claims['daily:' + today] = 1; d.day++; d.last = today; st.week.prog.days++;
    return { ok: true, reward: res, prem: !!r.prem, day: d.day, cycle: d.cycle };
  }
  function dailyView(st, raw) {
    const now = tick(st, raw), d = st.daily, done = d.last === iso(now); let cyc = d.cycle, n = d.day; const fresh = n >= 7 && !done; if (fresh) { cyc++; n = 0; }
    const col = DAILY[cyc % 3];
    return { canClaim: !done, name: col.name, cycle: cyc + 1, resetMs: nextDay(now) - now, items: col.d.map((r, i) => ({ r, text: describe(r), prem: !!r.prem, status: i < n ? 'claimed' : (i === n && !done ? 'available' : 'locked') })) };
  }
  function weekView(st, raw) {
    const now = tick(st, raw), col = WEEKLY[(+st.week.key.split('-W')[1]) % 3], p = st.week.prog;
    return { key: st.week.key, name: col.name, resetMs: nextWeek(now) - now, tiers: col.t.map((r, i) => {
      const need = NEED[i], have = need.k === 'all' ? [0, 1, 2, 3].filter((j) => st.week.claimed[j]).length : p[need.k], claimed = !!st.week.claimed[i];
      return { r, text: describe(r), need: need.n, have: Math.min(have, need.n), kind: need.k, status: claimed ? 'claimed' : have >= need.n ? 'available' : 'locked' }; }) };
  }
  function claimWeekly(st, raw, i, opt) {
    const now = tick(st, raw), v = weekView(st, now), t = v.tiers[i], key = 'weekly:' + st.week.key + ':' + i;
    if (!t) return { ok: false, reason: 'bad_tier' }; if (st.claims[key] || t.status === 'claimed') return { ok: false, reason: 'already_claimed' }; if (t.status !== 'available') return { ok: false, reason: 'locked' };
    const g = adGate(st, opt, 'weekly'); if (g) return g; useAd(st, opt);
    const res = grant(st, t.r, 'weekly', now, key); st.claims[key] = 1; st.week.claimed[i] = 1; return { ok: true, reward: res, prem: i === 4 };
  }
  function progress(st, raw, stat, n = 1) { tick(st, raw); st.week.prog[stat] = (st.week.prog[stat] || 0) + n; }
  const total = WHEEL.reduce((a, s) => a + s.w, 0);
  const probabilities = () => WHEEL.map((s, i) => ({ i, t: s.t, p: +(s.w / total * 100).toFixed(1), d: s.d || (s.c ? '🪙 ' + s.c : '💎 ' + s.g) }));
  /* src: 'free' | 'ticket' | 'ad'. An ad spin needs a server-verified proof ({verified:true, txId}); without it nothing is consumed or granted. */
  function spin(st, raw, src, rng, opt = {}) {
    const now = tick(st, raw), sp = st.sp;
    if (opt.rid && st.claims['req:' + opt.rid]) return Object.assign({ ok: true, dup: true }, st.claims['req:' + opt.rid]);
    if (sp.free + sp.ad + sp.tk >= LIM.total) return { ok: false, reason: 'daily_limit' };
    if (src === 'free') { if (sp.free >= LIM.free) return { ok: false, reason: 'no_free' }; }
    else if (src === 'ticket') { if (sp.free < LIM.free) return { ok: false, reason: 'use_free_first' }; if (st.tickets < 1) return { ok: false, reason: 'no_ticket' }; }
    else if (src === 'ad') { const a = opt.adProof; if (!a || !a.verified || !a.txId) return { ok: false, reason: 'ad_unverified' }; if (st.claims['ad:' + a.txId]) return { ok: false, reason: 'ad_already_used' }; if (sp.ad >= LIM.ad) return { ok: false, reason: 'no_ad_spins' }; }
    else return { ok: false, reason: 'bad_source' };
    let x = rng() * total, i = 0; while (x >= WHEEL[i].w) { x -= WHEEL[i].w; i++; }
    const s = WHEEL[i]; let r = { c: s.c, g: s.g };
    if (s.pool) { const free = POOL[s.pool].filter((it) => !st.inv.includes(it)); if (free.length) r = { item: free[Math.floor(rng() * free.length)] }; else r = { c: 100 }; }
    if (src === 'free') sp.free++; else if (src === 'ticket') { sp.tk++; st.tickets--; } else { sp.ad++; st.claims['ad:' + opt.adProof.txId] = 1; }
    const res = grant(st, r, 'spin', now, 'spin'); st.week.prog.spins++;
    const out = { slice: i, jackpot: !!s.jp, reward: res }; st.hist.push({ ts: now, src, slice: i, text: res.text, jp: out.jackpot }); if (st.hist.length > 40) st.hist.shift();
    if (opt.rid) st.claims['req:' + opt.rid] = out; return Object.assign({ ok: true }, out);
  }
  return { LIM, WHEEL, DICE, TOKS, AV, FRN, DAILY, WEEKLY, NEED, newState, tick, claimDaily, dailyView, weekView, claimWeekly, progress, spin, probabilities, describe, name, iso, wk };
})();

const st=await new Promise(res=>{pend={nonce:s.nonce,done:res};const t=setTimeout(()=>{if(pend&&pend.nonce===s.nonce){pend=null;res('timeout')}},180000);const d0=pend.done;pend.done=v=>{clearTimeout(t);d0(v)};try{br().showRewarded(s.nonce,ACCS.dev,kind)}catch(e){pend=null;clearTimeout(t);res('failed')}});
if(st!=='completed')return{ok:false,reason:st==='closed'||st==='unavailable'?st:'failed'};
if(mode==='dev'){try{await API.call('POST','/api/ads/complete',{nonce:s.nonce})}catch(e){return{ok:false,reason:'network'}}}
for(let i=0,N=window.LUDO_AD_POLLS||15;i<N;i++){let r;try{r=await API.call('POST','/api/ads/redeem',{nonce:s.nonce,kind})}catch(e){return{ok:false,reason:'network'}}
if(r.ok&&r.proof&&r.proof.verified)return{ok:true,proof:r.proof};if(r.reason!=='pending')return{ok:false,reason:'unverified'};await sleep2(1000)}
return{ok:false,reason:'unverified'}}finally{busy=false}}
/* banners: only on non-gameplay screens, never tied to rewards */
const BANNER={home:1,store:1,inv:1,msg:1,fr:1,prof:1};let bs=null;
function screen(s){if(!(br()&&br().showBanner))return;const want=!!BANNER[s];if(want===bs)return;bs=want;try{br()&&br().showBanner&&br().showBanner(want)}catch(e){}}
/* interstitial: only after a finished match, on the way back to Home; at most every 2nd finished match and not within 3 minutes of the last one */
let done=0,last=0;try{last=+sessionStorage.getItem('lp-ad-last')||0}catch(e){}
function afterMatch(){done++;if(done%2||Date.now()-last<18e4||M&&!M.done&&$('#game').classList.contains('on'))return;if(!(br()&&br().showInterstitial))return;last=Date.now();try{sessionStorage.setItem('lp-ad-last',String(last))}catch(e){}try{br().showInterstitial()}catch(e){}}
return{rewarded,screen,afterMatch,has}})();
ACC.row();if(ACCS.a){go('home');setTimeout(()=>ACC.sync(),1500)}

/* ===== v4: fixed layout (computed once), zoom/scroll lock ===== */
const LK={W:0,H:0};
function insetsPx(){const d=document.createElement('div');d.style.cssText='position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';document.body.appendChild(d);const c=getComputedStyle(d),r={t:parseFloat(c.paddingTop)||0,r:parseFloat(c.paddingRight)||0,b:parseFloat(c.paddingBottom)||0,l:parseFloat(c.paddingLeft)||0};d.remove();return r}
function layoutLock(force){const W=Math.round(window.innerWidth),H=Math.round(window.innerHeight);
if(!force&&LK.W){const rot=(W>H)!=(LK.W>LK.H);if(!rot&&Math.abs(W-LK.W)<3&&Math.abs(H-LK.H)<150)return}
LK.W=W;LK.H=H;const I=insetsPx(),land=W>H,six=!!(M&&M.cfg.n>=5),bar=land?54:64,pad=8,gap=6,capH=land?0:20,usableW=W-I.l-I.r-2*pad;
let cs=six?Math.min(78,(usableW-24)/3.75):Math.min(102,W*.23);cs=Math.max(54,cs);let bs,colw;
const calc=()=>{if(!land){bs=Math.min(usableW,H-I.t-I.b-bar-12-2*cs-capH-3*gap);colw=usableW}else{const per=six?3:2;bs=Math.min(H-I.t-I.b-bar-12,W-I.l-I.r-2*(cs+(six?0:cs*.7))-36);cs=Math.min(cs,(bs-8*(per-1))/per);colw=cs+(six?0:cs*.7+6)}};
calc();if(!land){while(bs<usableW&&cs>54){cs-=2;calc()}}else{for(let i=0;i<6;i++)calc()}
bs=Math.max(180,Math.floor(bs));cs=Math.floor(cs);const r=document.documentElement.style,set=(k,v)=>r.setProperty(k,v+'px');
set('--W',W);set('--H',H);set('--st',I.t);set('--sb',I.b);set('--sl',I.l);set('--sr',I.r);set('--cs',cs);set('--bs',bs);set('--bar',bar);set('--cap',capH);set('--gap',gap);set('--gw',Math.floor(usableW));set('--colw',Math.floor(colw));
document.body.classList.toggle('land',land)}
let lkT=0;const relock=()=>{clearTimeout(lkT);lkT=setTimeout(()=>layoutLock(false),140)};addEventListener('resize',relock);addEventListener('orientationchange',()=>{setTimeout(()=>layoutLock(true),300)});
const noZoom=e=>e.preventDefault();['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,noZoom,{passive:false}));
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(document.body.classList.contains('ingame')&&!(e.target.closest&&e.target.closest('.ov'))))e.preventDefault()},{passive:false});
document.addEventListener('dblclick',noZoom,{passive:false});document.addEventListener('wheel',e=>{if(e.ctrlKey||document.body.classList.contains('ingame'))e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(document.body.classList.contains('ingame'))e.preventDefault()});
addEventListener('scroll',()=>{if(document.body.classList.contains('ingame')&&(scrollX||scrollY))scrollTo(0,0)},{passive:true});

/* ===== v3: pause gate, in-game settings, player management ===== */
function setPause(on){if(on){if(!gate)gate=new Promise(r=>gateRes=r)}else if(gate){const r=gateRes;gate=null;gateRes=null;r()}}
const hostOf=m=>m.players.find(p=>p.i0==0&&p.human);
const pname=(m,p)=>p.human?disp(m,p):L('Computer','कंप्यूटर')+' '+(p.i0+1-m.cfg.h);
/* Connection hook for a future online layer: setPlayerConnection('y', false) marks that seat as disconnected. */
window.setPlayerConnection=(k,on)=>{if(!M)return false;const p=M.players.find(x=>x.k==k);if(!p||!p.human||p.i0==0)return false;p.conn=!!on;if(!$('#gs').hidden)gsRender();return true};
function removeNow(m,k){const i=m.players.findIndex(x=>x.k==k);if(i<0)return;const was=i==m.turn;
if(!m.players[i].fin)m.quit.push(m.players[i]);S=S.filter(t=>{if(t.k==k){t.el.remove();return false}return true});m.players.splice(i,1);
if(i<m.turn)m.turn--;else if(was)m.turn=m.turn%m.players.length;
if(was){m.roll=0;m.elig=[];m.canRoll=false;m.dice={state:'idle',value:0};face(dice,0);dice.dataset.v=0;dice.classList.remove('roll','rolling');m.needTurn=true}}
function purge(m){const q=m.pendRm;m.pendRm=[];q.forEach(k=>{if(m.players.length>1&&m.players.some(x=>x.k==k))removeNow(m,k)});render()}
const GSW=(id,on,label)=>`<div class="ar"><span>${label}</span><button class="sw" id="${id}" role="switch" aria-checked="${!!on}" aria-label="${label}" data-q="1"></button></div>`;
const GSL=(id,v,label)=>`<div class="ar sl"><span>${label}</span><span class="pct" id="${id}-v">${v}%</span><input type="range" id="${id}" min="0" max="100" value="${v}" aria-label="${label}"></div>`;
let gsView='main',gsRm=null,gsFrom='main';
function gsRender(){const m=M,P=A.prefs,el=$('#gsp');if(!m)return;
if(gsView=='confirm-rm'){const p=m.players.find(x=>x.k==gsRm);if(!p){gsView='main';return gsRender()}const act=m.players[m.turn]===p||m.busy;
el.innerHTML=`<div class="cf"><h3 id="gst">${L('Remove player?','खिलाड़ी हटाएँ?')}</h3><p>${esc(pname(m,p))} ${L('is disconnected. Their tokens will leave the board and the game continues with the next player.','डिसकनेक्ट है। इनकी गोटियाँ बोर्ड से हट जाएँगी और खेल अगले खिलाड़ी से चलेगा।')}${m.players.length==2?' '+L('Only you will remain and the match continues as practice.','सिर्फ़ आप बचेंगे और मैच प्रैक्टिस की तरह चलेगा।'):''}${m.busy?' '+L('This happens right after the current move.','यह मौजूदा चाल के तुरंत बाद होगा।'):''}</p><div class="two3"><button class="btn w" id="gsNo">${L('Cancel','रद्द करें')}</button><button class="btn r" id="gsYes">${L('Remove','हटाएँ')}</button></div></div>`;
$('#gsNo').onclick=()=>{gsView='main';gsRender()};$('#gsYes').onclick=()=>{const n=pname(m,p);if(m.busy){(m.pendRm=m.pendRm||[]).push(p.k);toast(n+' · '+L('will be removed after this move','इस चाल के बाद हटाया जाएगा'))}else{removeNow(m,p.k);render();toast(n+' '+L('removed','हटाया गया'))}gsView='main';gsRender()};return}
if(gsView=='confirm-home'){el.innerHTML=`<div class="cf"><h3 id="gst">${L('Leave this match?','मैच छोड़ें?')}</h3><p>${L('The current match will end and you will go back to Home.','मौजूदा मैच खत्म हो जाएगा और आप होम पर लौट जाएँगे।')}</p><div class="two3"><button class="btn w" id="gsNo">${L('Stay','रुकें')}</button><button class="btn r" id="gsYes">${L('Return Home','होम जाएँ')}</button></div></div>`;
$('#gsNo').onclick=()=>{if(gsFrom=='confirm-home')gsClose();else{gsView='main';gsRender()}};$('#gsYes').onclick=()=>{gsClose(true);leaveMatch()};return}
const host=m.cfg.online?null:hostOf(m),pend=m.pendRm||[],rows=m.players.map((p,i)=>{const pr=p.human?PRF.d[p.i0]:null,isT=i==m.turn&&!m.done,pe=pend.includes(p.k);
const st=pe?`<span class="chip2 off">${L('Leaving after this move','चाल के बाद हटेगा')}</span>`:!p.human?`<span class="chip2 ok">${L('Computer','कंप्यूटर')}</span>`:!p.conn?`<span class="chip2 off">${L('Disconnected','डिसकनेक्ट')}</span>`:isT?`<span class="chip2 turn">${L('Playing now','अभी खेल रहा')}</span>`:`<span class="chip2 ok">${L('Online','ऑनलाइन')}</span>`;
const role=p.i0==0&&p.human?L('Host','होस्ट'):p.human?L('Player','खिलाड़ी'):'';
const acts=(host&&p.human&&p.i0!=0&&!pe)?`<button class="mb" data-conn="${p.k}">${p.conn?L('Mark offline','ऑफ़लाइन करें'):L('Reconnect','फिर जोड़ें')}</button><button class="mb rm" data-rm="${p.k}" ${p.conn?'disabled':''}>${L('Remove','हटाएँ')}</button>`:'';
return `<div class="pl" style="--pc:${G[p.k][1]}"><div class="av sq fr-${pr?pr.frame:0}">${AVT[pr?pr.avatar:p.i0]}</div><div class="pn3"><b>${esc(pname(m,p))}</b>${role?`<span class="chip2 wait">${role}</span> `:''}${st}</div><div class="pa">${acts}</div></div>`}).join('');
const canRm=m.players.length>1;
el.innerHTML=`<div class="gh"><div style="flex:1"><h2 id="gst">${L('Settings','सेटिंग्स')}</h2><small>${L('Game paused','खेल रुका हुआ है')}</small></div></div>
<div class="sec">${L('Audio','ऑडियो')}</div><div class="st">${GSW('g-ov',P.ov,L('Game Voice','गेम वॉइस'))}${GSL('g-v',P.v,L('Male Voice Volume','पुरुष आवाज़ वॉल्यूम'))}${GSW('g-om',P.om,L('Background Music','बैकग्राउंड म्यूज़िक'))}${GSL('g-mu',P.mu,L('Music Volume','म्यूज़िक वॉल्यूम'))}${GSW('g-os',P.os,L('Sound Effects','साउंड इफ़ेक्ट'))}${GSL('g-s',P.s,L('Sound Effects Volume','इफ़ेक्ट वॉल्यूम'))}</div>
<div class="sec">${L('Player Management','खिलाड़ी प्रबंधन')}</div><div class="st">${rows}</div>
<p class="hint">${host?(canRm?L('Only a disconnected player can be removed, and only by the host. Mark a friend offline if they walked away.','सिर्फ़ डिसकनेक्ट खिलाड़ी को होस्ट हटा सकता है। कोई दोस्त चला गया हो तो उसे ऑफ़लाइन करें।'):L('No other player to remove.','हटाने के लिए कोई और खिलाड़ी नहीं है।')):m.cfg.online?L('Disconnected players are skipped, and removed by the server after 60 seconds.','डिसकनेक्ट खिलाड़ी की बारी छोड़ दी जाती है और 60 सेकंड बाद सर्वर उसे हटा देता है।'):L('Players can be removed only in matches with a human host.','खिलाड़ी हटाना सिर्फ़ मानव होस्ट वाले मैच में संभव है।')}</p>
<div class="foot"><button class="btn" id="gsResume" data-q="1">▶ ${L('Resume Game','खेल जारी रखें')}</button><button class="btn w" id="gsHome">${L('Return to Home','होम पर लौटें')}</button></div>`;
const bind=(id,k)=>{const b=$('#'+id);b.onclick=()=>{const v=!(+A.prefs[k]);A.set(k,v?1:0);if(k=='ov'){$('#o-ov').checked=v;paintVm();if(!v)A.stopVoice()}if(k=='om')$('#o-om').checked=v;if(k=='os')$('#o-os').checked=v;b.setAttribute('aria-checked',v)}};
bind('g-ov','ov');bind('g-om','om');bind('g-os','os');
const sl=(id,k,mirror,prev)=>{const e=$('#'+id);e.oninput=()=>{A.set(k,+e.value);$('#'+id+'-v').textContent=e.value+'%';$('#'+mirror).value=e.value};e.onchange=prev};
sl('g-v','v','r-v',()=>{if(A.prefs.ov)DLG.preview()});sl('g-mu','mu','r-mu',()=>{});sl('g-s','s','r-s',()=>A.sfx('six'));
$$('[data-conn]').forEach(b=>b.onclick=()=>{const p=m.players.find(x=>x.k==b.dataset.conn);p.conn=!p.conn;gsRender()});
$$('[data-rm]').forEach(b=>b.onclick=()=>{gsRm=b.dataset.rm;gsView='confirm-rm';gsRender()});
$('#gsResume').onclick=()=>gsClose();$('#gsHome').onclick=()=>{gsView='confirm-home';gsRender()}}
function gsOpen(v){if(typeof v!='string')v='main';if(!M||M.done||!$('#game').classList.contains('on')||!$('#gs').hidden)return;setPause(true);A.stopVoice();gsFrom=v;gsView=v;gsRender();$('#gs').hidden=false;$('#gsResume')&&$('#gsResume').focus()}
function gsClose(keepPaused){$('#gs').hidden=true;if(keepPaused)return;gsFrom='main';const m=M;setPause(false);if(m&&!m.done){if(m.pendRm&&m.pendRm.length&&!m.busy)purge(m);render();if(m.needTurn){m.needTurn=false;turnStart(m)}}$('#gsBtn').focus()}
$('#gsBtn').onclick=()=>gsOpen('main');
$('#gs').addEventListener('click',e=>{if(e.target.id=='gs')gsClose()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#gs').hidden)gsClose()});
